<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop.co</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header>
    <div class="signup">
      <p>Sign up and get 20% off to your first order. 
      <bold>Sign Up Now</bold></p>
    </div>
    
      <div class="header-2">
        <h2 class="header-logo">SHOP.CO</h2>
        <nav class="navbar">
        <ul>
          <li>Shop</li>
          <li>On Sale</li>
          <li>New Arrivals</li>
          <li>Brands</li>
        </ul>
        </nav>
        <div class="input-wrapper">
        <img src="/assets/images/search-logo.png" class="search-icon">
        <input placeholder="Search for products..." class="search">
        </div>
        <div class="header-options">
          <a href="/"><img src="/assets/images/cart-logo.png"></a>
          <a href="/"><img src="/assets/images/profile-logo.png"></a>
        </div>
      </div>
  </header>
  <main>
    <section class="hero">
      <div class="hero-div">
        <h1 class="hero-heading">FIND CLOTHES THAT MATCH YOUR STYLE</h1>
        <p class="hero-para">Browse through our diverse range of meticulously crafted garments, designed to bring out your individuality and cater to your sense of style.</p>
        <button class="hero-btn">Shop now</button>
        <img src="/assets/images/hero-2.png" class="hero-2"></img>
      </div>
      <div class="brands">
        <img src="/assets/images/brand-1.png"></img>
        <img src="/assets/images/brand-last.png"></img>
        <img src="/assets/images/zara-logo-1 1.png"></img>
        <img src="/assets/images/prada-logo-1 1.png"></img>
        <img src="/assets/images/gucci-logo-1 1.png"></img>
      </div>
    </section>
    
  </main>
</body>
</html>
