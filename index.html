<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop.co</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header>
    <div class="signup">
      <p>Sign up and get 20% off to your first order. 
      <bold>Sign Up Now</bold></p>
    </div>
    
      <div class="header-2">
        <h2 class="header-logo">SHOP.CO</h2>
        <nav class="navbar">
        <ul>
          <li>Shop</li>
          <li>On Sale</li>
          <li>New Arrivals</li>
          <li>Brands</li>
        </ul>
        </nav>
        <div class="input-wrapper">
        <img src="/assets/images/search-logo.png" class="search-icon">
        <input placeholder="Search for products..." class="search">
        </div>
        <div class="header-options">
          <a href="/"><img src="/assets/images/cart-logo.png"></a>
          <a href="/"><img src="/assets/images/profile-logo.png"></a>
        </div>
      </div>
  </header>
  <main>
    <section class="hero">
      <div class="hero-div">
        <image src="/assets/images/Rectangle 2.png" alt="Hero Banner"></image>
      </div>
    </section>
    
  </main>
</body>
</html>
